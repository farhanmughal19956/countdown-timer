<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link
      rel="icon"
      type="image/jpeg"
      href="https://c7.alamy.com/comp/RGY5B1/3d-illustration-of-countdown-timer-title-with-a-digital-display-clock-as-a-background-RGY5B1.jpg"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet"
  />
  <body>
    <div class="main">
      <div class="overlay">
        <div class="title">We are coming soon</div>
        <div class="title" id="end-date">March 10 2022 10:19</div>
        <div class="col">
          <div>
            <input type="text" readonly value="0" />
            <label for="Days">Days</label>
          </div>
          <div>
            <input type="text" readonly value="0" />
            <label for="Hours">Hours</label>
          </div>
          <div>
            <input type="text" readonly value="0" />
            <label for="Minutes">Minutes</label>
          </div>
          <div>
            <input type="text" readonly value="0" />
            <label for="Seconds">Seconds</label>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
